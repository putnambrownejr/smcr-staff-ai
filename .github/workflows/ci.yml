name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'codex/release-*'

jobs:
  tests-and-types:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev --extra cloud

      - name: Check public publication snapshot
        run: uv run --frozen --extra cloud python scripts/build_public_catalog.py --check

      - name: Install Playwright browsers
        run: uv run --frozen playwright install chromium --with-deps

      - name: Start application server
        run: uv run --frozen uvicorn app.main:app --port 8000 &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 1
          done
          curl -sf http://localhost:8000/health

      - name: Run tests
        run: uv run --frozen pytest tests/ -q

      - name: Run dashboard browser tests
        run: uv run --frozen pytest tests/e2e/ -m e2e -q

      - name: Run public library browser tests
        run: uv run --frozen --extra cloud pytest tests/public_library/ -m e2e -q

      - name: Build public library image
        if: runner.os == 'Linux'
        run: docker build -f Dockerfile.public -t smcr-public-library:ci .

      - name: Build local dashboard image
        if: runner.os == 'Linux'
        run: docker build -t smcr-staff-ai:ci .

      - name: Run type checks
        run: uv run --frozen mypy app tests

      - name: Lint ruff
        run: uv run --frozen ruff check .
